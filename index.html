<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bijles By Victor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Optional: Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Victor's Bijles</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Over mij</a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html">Tarieven</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="py-5 bg-white border-bottom">
        <div class="container py-4 text-center">
            <h1 class="display-4 fw-bold text-dark">Victor's Bijles</h1>
            <p class="lead text-muted col-lg-8 mx-auto mt-3">
                Doelgerichte begeleiding in Wiskunde, Natuurkunde, Scheikunde en Economie. Ga van stampen naar begrijpen.
            </p>
            <div class="mt-4">
                <a href="#contact" class="btn btn-primary btn-lg px-4 me-md-2">Neem contact op</a>
                <a href="#ervaringen" class="btn btn-outline-secondary btn-lg px-4">Ervaringen</a>
            </div>
        </div>
    </header>

    <!-- Testimonial Section -->
    <section id="ervaringen" class="py-5">
        <div class="container py-3">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">
                    <div class="card shadow-sm border-0 rounded-4 p-4">
                        <div class="card-body text-center">
                            <i class="bi bi-quote text-primary display-4 d-block mb-3"></i>
                            <figure class="mb-0">
                                <blockquote class="blockquote fs-5 italic">
                                    <p>"Victor legt de stof rustig en vanuit de basis uit. Na een paar sessies snapte ik de lastige onderwerpen van Wiskunde B eindelijk écht en ging mijn cijfer flink omhoog."</p>
                                </blockquote>
                                <figcaption class="blockquote-footer mt-3 mb-0 fs-6 fw-semibold text-primary">
                                    VWO 6 Leerling <cite title="Source Title">(Examentraining Wiskunde B)</cite>
                                </figcaption>
                            </figure>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact CTA Section -->
    <div id="contact-banner"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
