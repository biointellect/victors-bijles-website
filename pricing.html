<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarieven - Victor's Bijles</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100" data-page="pricing">

    <!-- Navigatie -->
    <div id="main-navbar"></div>

    <!-- Header -->
    <header class="py-5 bg-white border-bottom text-center">
        <div class="container">
            <h1 class="fw-bold">Tarieven & Begeleiding</h1>
            <p class="lead text-muted">Heldere prijzen zonder vastcontract of verborgen kosten.</p>
        </div>
        <div class="col-lg-8 text-center">
            <div class="d-flex justify-content-center flex-wrap gap-2">
                <span class="badge bg-white text-dark border px-3 py-2 shadow-sm"><i class="bi bi-check-circle text-success me-1"></i> Wiskunde A/B, Natuurkunde, Scheikunde & Economie</span>
                <span class="badge bg-white text-dark border px-3 py-2 shadow-sm"><i class="bi bi-check-circle text-success me-1"></i> Alle niveau's (MAVO / HAVO / VWO)</span>
            </div>
        </div>
    </header>

    <!-- Pricing Section -->
    <main class="container py-5 my-auto">
        <div id="pricing-cards" class="row justify-content-center g-4"></div>
    </main>

    <!-- Contact CTA Section -->
    <div id="contact-banner"></div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small class="text-secondary">&copy; Victor's Bijles. Alle rechten voorbehouden.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
